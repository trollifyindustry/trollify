<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Trolify Infotech Image Hosting</title>

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- SWEET ALERT -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- SUPABASE -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {

      font-family: 'Poppins', sans-serif;

      min-height: 100vh;

      background:
        linear-gradient(135deg,
          #0F0C29,
          #302B63);

      color: white;

      padding: 20px;

    }

    .container {

      max-width: 1400px;

      margin: auto;

    }

    .glass {

      background:
        rgba(255, 255, 255, 0.05);

      backdrop-filter: blur(12px);

      border:
        1px solid rgba(255, 255, 255, 0.1);

      border-radius: 25px;

      padding: 25px;

      margin-bottom: 25px;

      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.4);

    }

    h1 {

      text-align: center;

      margin-bottom: 25px;

      font-size: 35px;

    }

    .drop-area {

      border:
        2px dashed rgba(255, 255, 255, 0.2);

      border-radius: 20px;

      padding: 40px;

      text-align: center;

      cursor: pointer;

      transition: .3s;

    }

    .drop-area:hover {

      border-color: #FF7E5F;

    }

    .drop-area p {

      margin-bottom: 15px;

      font-size: 18px;

    }

    button {

      border: none;

      background:
        linear-gradient(135deg,
          #FF7E5F,
          #FEB47B);

      padding: 14px 28px;

      border-radius: 999px;

      color: white;

      font-size: 15px;

      cursor: pointer;

      transition: .3s;

    }

    button:hover {

      transform: scale(1.05);

    }

    .upload-btn {

      width: 100%;

      margin-top: 20px;

    }

    .form-group {

      margin-top: 18px;

    }

    input,
    select {

      width: 100%;

      padding: 16px;

      border: none;

      border-radius: 15px;

      outline: none;

      background:
        rgba(255, 255, 255, 0.08);

      color: white;

      font-size: 15px;

    }

    input::placeholder {

      color:
        rgba(255, 255, 255, 0.6);

    }

    .preview {

      width: 100%;

      max-height: 350px;

      object-fit: contain;

      border-radius: 20px;

      margin-top: 20px;

      display: none;

    }

    .progress-container {

      width: 100%;

      height: 14px;

      background:
        rgba(255, 255, 255, 0.1);

      border-radius: 999px;

      overflow: hidden;

      margin-top: 20px;

    }

    .progress-bar {

      width: 0%;

      height: 100%;

      background:
        linear-gradient(135deg,
          #FF7E5F,
          #FEB47B);

      transition: .3s;

    }

    #progressText {

      text-align: center;

      margin-top: 10px;

    }

    .table-top {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 20px;

      margin-bottom: 20px;

    }

    .table-wrapper {

      overflow-x: auto;

    }

    table {

      width: 100%;

      border-collapse: collapse;

    }

    th,
    td {

      padding: 15px;

      text-align: left;

      border-bottom:
        1px solid rgba(255, 255, 255, 0.08);

    }

    td img {

      width: 70px;

      height: 70px;

      object-fit: cover;

      border-radius: 12px;

    }

    .url-box {

      max-width: 250px;

      overflow: hidden;

      white-space: nowrap;

      text-overflow: ellipsis;

    }

    .count-box {

      margin-bottom: 15px;

      color: #FEB47B;

    }

    .empty-box {

      text-align: center;

      padding: 30px;

      color: #bbb;

    }

    @media(max-width:768px) {

      .table-top {

        grid-template-columns: 1fr;

      }

    }
  </style>

</head>

<body>

  <div class="container">

    <!-- UPLOAD SECTION -->
    <div class="glass">

      <h3>Trolify Infotech Image Hosting</h3>

      <div class="drop-area" id="dropArea">

        <input type="file"
          id="imageFile"
          hidden
          accept="image/*">

        <p>Drag & Drop Image Here</p>

        <button type="button"
          id="browseBtn">

          Browse Image

        </button>

      </div>

      <img id="preview"
        class="preview">

      <div class="form-group">

        <input type="text"
          id="userId"
          placeholder="Enter ID">

      </div>

      <div class="form-group">

        <input type="text"
          id="imageName"
          placeholder="Enter Image Name">

      </div>

      <div class="form-group">

        <select id="quality">

          <option value="original">
            Original Quality
          </option>

          <option value="low">
            Low Quality (~1MB)
          </option>

        </select>

      </div>

      <button type="button"
        class="upload-btn"
        id="uploadBtn">

        Upload Image

      </button>

      <div class="progress-container">

        <div class="progress-bar"
          id="progressBar"></div>

      </div>

      <p id="progressText">0%</p>

    </div>

    <!-- TABLE -->
    <div class="glass">

      <div class="table-top">

        <input type="text"
          id="searchInput"
          placeholder="Search Image Name">

        <input type="text"
          id="filterId"
          placeholder="Search By ID">

      </div>

      <div class="count-box"
        id="countBox">

        Total Images: 0

      </div>

      <div class="table-wrapper">

        <table>

          <thead>

            <tr>

              <th>#</th>
              <th>Name</th>
              <th>Preview</th>
              <th>URL</th>
              <th>Copy</th>
              <th>Time</th>

            </tr>

          </thead>

          <tbody id="tableBody">

            <tr>

              <td colspan="6"
                class="empty-box">

                No Images Found

              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>
<script>

  // ==========================
  // CHECK LIBRARY
  // ==========================

  if (typeof window.supabase === "undefined") {

    Swal.fire({
      icon: "error",
      title: "Supabase Library Failed To Load"
    });

  }

  // ==========================
  // CONFIG
  // ==========================

  const SUPABASE_URL =
    "https://veyvsbcqhzmescvpbnra.supabase.co";

  const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZleXZzYmNxaHptZXNjdnBibnJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMDM1NDIsImV4cCI6MjA5NDU3OTU0Mn0.ptRkXx1CP18tVJIKF1PD2KLDXOIIMPo1i_Uf8R7-CCE";

  const BUCKET_NAME =
    "images";

  // ==========================
  // CLIENT
  // ==========================

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  // ==========================
  // ELEMENTS
  // ==========================

  const imageFile =
    document.getElementById("imageFile");

  const browseBtn =
    document.getElementById("browseBtn");

  const preview =
    document.getElementById("preview");

  const uploadBtn =
    document.getElementById("uploadBtn");

  const progressBar =
    document.getElementById("progressBar");

  const progressText =
    document.getElementById("progressText");

  const dropArea =
    document.getElementById("dropArea");

  // ==========================
  // BROWSE
  // ==========================

  browseBtn.addEventListener(
    "click",
    function (e) {

      e.stopPropagation();

      imageFile.click();

    });

  // ==========================
  // DROP AREA
  // ==========================

  dropArea.addEventListener(
    "click",
    function () {

      imageFile.click();

    });

  dropArea.addEventListener(
    "dragover",
    function (e) {

      e.preventDefault();

      dropArea.style.borderColor =
        "#FF7E5F";

    });

  dropArea.addEventListener(
    "dragleave",
    function () {

      dropArea.style.borderColor =
        "rgba(255,255,255,0.2)";

    });

  dropArea.addEventListener(
    "drop",
    function (e) {

      e.preventDefault();

      imageFile.files =
        e.dataTransfer.files;

      showPreview();

    });

  // ==========================
  // IMAGE PREVIEW
  // ==========================

  imageFile.addEventListener(
    "change",
    showPreview
  );

  function showPreview() {

    try {

      const file =
        imageFile.files[0];

      if (!file) return;

      preview.src =
        URL.createObjectURL(file);

      preview.style.display =
        "block";

    } catch (err) {

      Swal.fire({
        icon: "error",
        title: err.message
      });

    }

  }

  // ==========================
  // PROGRESS
  // ==========================

  function startProgress() {

    let width = 0;

    progressBar.style.width =
      "0%";

    progressText.innerText =
      "0%";

    const interval =
      setInterval(() => {

        if (width >= 90) {

          clearInterval(interval);

        } else {

          width++;

          progressBar.style.width =
            width + "%";

          progressText.innerText =
            width + "%";

        }

      }, 40);

  }

  // ==========================
  // COMPRESS IMAGE
  // ==========================

  async function compressImage(file) {

    return new Promise((resolve) => {

      const img = new Image();

      img.onload = () => {

        const canvas =
          document.createElement(
            "canvas"
          );

        let width = img.width;

        let height = img.height;

        const maxWidth = 1920;

        if (width > maxWidth) {

          height *=
            maxWidth / width;

          width = maxWidth;

        }

        canvas.width = width;

        canvas.height = height;

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        canvas.toBlob(

          (blob) => {

            resolve(blob);

          },

          "image/jpeg",

          0.7

        );

      };

      img.src =
        URL.createObjectURL(file);

    });

  }

  // ==========================
  // UPLOAD
  // ==========================

  uploadBtn.addEventListener(
    "click",
    async function () {

      try {

        const file =
          imageFile.files[0];

        const userId =
          document
          .getElementById("userId")
          .value
          .trim();

        const imageName =
          document
          .getElementById("imageName")
          .value
          .trim();

        const quality =
          document
          .getElementById("quality")
          .value;

        // VALIDATION
        if (!file) {

          Swal.fire({
            icon: "warning",
            title: "Please Select Image"
          });

          return;

        }

        if (!userId) {

          Swal.fire({
            icon: "warning",
            title: "Please Enter ID"
          });

          return;

        }

        if (!imageName) {

          Swal.fire({
            icon: "warning",
            title: "Please Enter Image Name"
          });

          return;

        }

        startProgress();

        Swal.fire({

          title: "Uploading...",

          text: "Please Wait",

          allowOutsideClick: false,

          didOpen: () => {

            Swal.showLoading();

          }

        });

        // FINAL FILE
        let finalFile = file;

        if (quality === "low") {

          finalFile =
            await compressImage(file);

        }

        // FILE NAME
        const fileName =
          Date.now() +
          "_" +
          imageName +
          ".jpg";

        // UPLOAD STORAGE
        const { error } =
          await supabaseClient
            .storage
            .from(BUCKET_NAME)
            .upload(
              fileName,
              finalFile
            );

        if (error) {

          throw error;

        }

        // PUBLIC URL
        const publicUrlData =
          supabaseClient
            .storage
            .from(BUCKET_NAME)
            .getPublicUrl(
              fileName
            );

        const imageUrl =
          publicUrlData
            .data
            .publicUrl;

        // SAVE DATABASE
        const {
          error: dbError
        } =
          await supabaseClient
            .from("images")
            .insert([
              {
                id: userId,
                name: imageName,
                image_url: imageUrl,
                created_at:
                  new Date()
                  .toLocaleString()
              }
            ]);

        if (dbError) {

          throw dbError;

        }

        // COMPLETE
        progressBar.style.width =
          "100%";

        progressText.innerText =
          "100%";

        // COPY URL
        navigator.clipboard.writeText(
          imageUrl
        );

        Swal.fire({
          icon: "success",
          title: "Upload Successful",
          text: "Image URL Copied"
        });

        // AUTO SEARCH SAME ID
        document
          .getElementById("filterId")
          .value = userId;

        // RESET
        imageFile.value = "";

        preview.style.display =
          "none";

        document
          .getElementById("imageName")
          .value = "";

        // RELOAD TABLE
        loadTable();

      } catch (err) {

        console.log(err);

        Swal.fire({
          icon: "error",
          title: "Upload Failed",
          text: err.message
        });

      }

    });

  // ==========================
  // LOAD TABLE
  // ==========================

  async function loadTable() {

    try {

      const tbody =
        document
        .getElementById(
          "tableBody"
        );

      const filterId =
        document
        .getElementById(
          "filterId"
        )
        .value
        .trim();

      // EMPTY STATE
      if (!filterId) {

        tbody.innerHTML = `
        <tr>
          <td colspan="6"
            class="empty-box">

            Enter ID To View Images

          </td>
        </tr>
        `;

        document
          .getElementById("countBox")
          .innerText =
          "Total Images: 0";

        return;

      }

      tbody.innerHTML = `
      <tr>
        <td colspan="6"
          class="empty-box">
          Loading...
        </td>
      </tr>
      `;

      // FILTER BY ID
      const {
        data,
        error
      } =
        await supabaseClient
          .from("images")
          .select("*")
          .eq("id", filterId)
          .order(
            "created_at",
            {
              ascending: false
            }
          );

      if (error) {

        throw error;

      }

      renderTable(data);

    } catch (err) {

      console.log(err);

      Swal.fire({
        icon: "error",
        title: "Table Load Failed",
        text: err.message
      });

    }

  }

  // ==========================
  // RENDER TABLE
  // ==========================

  function renderTable(data) {

    try {

      const tbody =
        document
        .getElementById(
          "tableBody"
        );

      const search =
        document
        .getElementById(
          "searchInput"
        )
        .value
        .toLowerCase();

      const filtered =
        data.filter((item) => {

          const name =
            item.name || "";

          return (

            name
            .toLowerCase()
            .includes(search)

          );

        });

      // COUNT
      document
        .getElementById(
          "countBox"
        )
        .innerText =
        `Total Images: ${filtered.length}`;

      // EMPTY
      if (
        filtered.length === 0
      ) {

        tbody.innerHTML = `
        <tr>
          <td colspan="6"
            class="empty-box">

            No Images Found

          </td>
        </tr>
        `;

        return;

      }

      // TABLE
      tbody.innerHTML =
        filtered.map(
          (item, index) => `

        <tr>

          <td>${index + 1}</td>

          <td>${item.name}</td>

          <td>
            <img
              src="${item.image_url}">
          </td>

          <td class="url-box">
            ${item.image_url}
          </td>

          <td>

            <button
              onclick="copyUrl('${item.image_url}')">

              Copy

            </button>

          </td>

          <td>
            ${item.created_at}
          </td>

        </tr>

      `
        ).join("");

    } catch (err) {

      Swal.fire({
        icon: "error",
        title: err.message
      });

    }

  }

  // ==========================
  // COPY URL
  // ==========================

  function copyUrl(url) {

    navigator.clipboard.writeText(
      url
    );

    Swal.fire({
      icon: "success",
      title: "Copied Successfully",
      timer: 1200,
      showConfirmButton: false
    });

  }

  // ==========================
  // SEARCH
  // ==========================

  document
    .getElementById(
      "searchInput"
    )
    .addEventListener(
      "input",
      loadTable
    );

  document
    .getElementById(
      "filterId"
    )
    .addEventListener(
      "input",
      loadTable
    );

  // ==========================
  // INITIAL LOAD
  // ==========================

  loadTable();

</script>
</body>

</html>
